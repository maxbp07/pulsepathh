# Apache vhost — app.getpulsepath.com
# Proxy inverso hacia el nginx de Docker Compose (127.0.0.1:3001).
# Apache ya ocupa 80/443 en el Contabo; NO desinstalar Apache.
#
# Instalación en el VPS:
#   1. a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   2. cp deploy/apache/app.getpulsepath.com.conf /etc/apache2/sites-available/
#   3. a2ensite app.getpulsepath.com.conf
#   4. apache2ctl configtest && systemctl reload apache2
#   5. certbot --apache -d app.getpulsepath.com
#
# Tras certbot, este fichero quedará ampliado con el bloque SSL.

<VirtualHost *:80>
    ServerName app.getpulsepath.com

    # ACME challenge (certbot HTTP-01)
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Proxy a nginx del stack PulsePath (docker-compose.prod.yml: 3001:80)
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/app.getpulsepath.com-error.log
    CustomLog ${APACHE_LOG_DIR}/app.getpulsepath.com-access.log combined
</VirtualHost>
